<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d3477">
<title>CONAF 2026 · Roteiro da Mestre de Cerimônias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1d3477; --navy2:#2c4588; --blue:#1383c3; --cyan:#29b6e6; --aqua:#5bc4d7;
  --bg:#eef3f9; --paper:#ffffff; --ink:#111827; --muted:#5b6782; --line:#d9e2ef;
  --card:#ffffff; --shadow:0 1px 2px rgba(16,32,80,.06),0 8px 24px rgba(16,32,80,.08);
  --red:#c00000; --gray:#5a5a5a; --docblue:#1e5f8c;
  --z:1;
  --ui:"Montserrat",Arial,Helvetica,sans-serif;
  --grad:linear-gradient(120deg,#1d3477 0%,#2c4588 35%,#1383c3 75%,#29b6e6 100%);
  --safe-b:env(safe-area-inset-bottom,0px);
}
html.dark{
  --bg:#0a1226; --paper:#101b36; --ink:#eef2fa; --muted:#9fb0cf; --line:#22335c;
  --card:#13213f; --shadow:0 1px 2px rgba(0,0,0,.4);
  --red:#ff8080; --gray:#b4bfd4; --docblue:#86c8ff;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
.hidden{display:none!important}

/* ---------- top brand bar ---------- */
.brandbar{background:#fff;border-bottom:1px solid #e3e9f3}
html.dark .brandbar{background:#fff}
.brandbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:12px;padding-bottom:12px}
.brandbar img.conaf{height:46px;width:auto;display:block}
.brandbar img.sind{height:34px;width:auto;display:block}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;background:var(--grad);color:#fff}
.hero svg.circuit{position:absolute;inset:0;width:100%;height:100%;opacity:.18;pointer-events:none}
.hero .wrap{position:relative;padding-top:34px;padding-bottom:40px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.9}
.hero h1{font-weight:900;font-size:clamp(28px,6vw,46px);line-height:1.05;margin:10px 0 12px;letter-spacing:-.01em}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;font-weight:600;opacity:.95}
.hero .meta span{display:inline-flex;align-items:center;gap:7px}
.hero .hero-grid{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(260px,1fr);gap:28px;align-items:center;padding-top:26px;padding-bottom:30px}
.hero h1{font-size:clamp(26px,4.4vw,40px)}
.hero .tema{margin:0;font-size:15px;line-height:1.45;font-weight:600;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:12px 16px}
.hero .tema small{display:block;font-size:11px;letter-spacing:.14em;font-weight:800;opacity:.85;margin-bottom:4px}

/* ---------- section titles ---------- */
.sec{margin:30px 0 14px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec h2{margin:0;font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--navy2)}
html.dark .sec h2{color:#8fd3f5}
.sec .aside{font-size:13px;color:var(--muted);font-weight:600}

/* ---------- today banner ---------- */
.today{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:-22px;position:relative;z-index:2;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;border-left:6px solid var(--cyan);text-decoration:none}
.today b{font-size:15px}
.today .go{white-space:nowrap;background:var(--navy);color:#fff;border-radius:999px;padding:9px 14px;font-weight:700;font-size:13px}

/* ---------- day cards ---------- */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.day{position:relative;display:flex;flex-direction:column;text-decoration:none;background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;min-height:190px;transition:transform .15s ease, box-shadow .15s ease;border:1px solid transparent}
.day:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(16,32,80,.08),0 14px 34px rgba(16,32,80,.14)}
.day:active{transform:scale(.99)}
.day .top{background:var(--grad);color:#fff;padding:14px 16px 12px;display:flex;align-items:flex-end;justify-content:space-between;position:relative}
.day .num{font-size:52px;font-weight:900;line-height:.85;letter-spacing:-.03em}
.day .wd{font-size:12px;font-weight:800;letter-spacing:.14em;text-align:right;line-height:1.35}
.day .wd em{font-style:normal;display:block;font-size:11px;opacity:.85;letter-spacing:.08em}
.day .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.day .title{font-size:15px;font-weight:700;line-height:1.3;color:var(--ink)}
.day .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:999px;padding:5px 10px;background:#e7f4fb;color:#0d5f8f}
html.dark .chip{background:#173257;color:#9fd8fb}
.chip.warn{background:#fdecec;color:#a11}
html.dark .chip.warn{background:#3b1b22;color:#ff9b9b}
.chip.mute{background:#eef1f6;color:var(--muted)}
html.dark .chip.mute{background:#1b2949}
.arrow{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:#fff;flex:none}
.day.soft .top{background:linear-gradient(120deg,#8a97b5,#a9b8cf)}
.day.isToday{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(41,182,230,.35),var(--shadow)}
.badge-today{position:absolute;top:10px;right:12px;background:#fff;color:var(--navy);font-size:10px;font-weight:900;letter-spacing:.12em;border-radius:999px;padding:4px 8px}
.day.isToday .wd{margin-top:20px}

/* ---------- utility cards ---------- */
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tool{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px 18px;text-decoration:none;display:flex;gap:14px;align-items:flex-start;cursor:pointer;border:0;text-align:left;width:100%}
.tool .ic{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--grad);color:#fff}
.tool h3{margin:0 0 4px;font-size:15px;font-weight:800}
.tool p{margin:0;font-size:13px;line-height:1.45;color:var(--muted);font-weight:500}

details.box{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
details.box+details.box{margin-top:12px}
details.box summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:800;font-size:15px}
details.box summary::-webkit-details-marker{display:none}
details.box summary .chev{transition:transform .2s}
details.box[open] summary .chev{transform:rotate(180deg)}
details.box .inner{padding:4px 18px 18px;border-top:1px solid var(--line)}

/* ---------- day view ---------- */
.appbar{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;box-shadow:0 2px 12px rgba(10,20,60,.25)}
.appbar .wrap{display:flex;align-items:center;gap:8px;height:56px}
.appbar .back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:700;font-size:14px;padding:8px 10px 8px 4px;border-radius:10px}
.appbar .ttl{flex:1;min-width:0;font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.iconbtn{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;height:38px;min-width:38px;padding:0 9px;display:inline-grid;place-items:center;cursor:pointer;font-weight:800;font-size:14px}
.iconbtn:active{background:rgba(255,255,255,.25)}
.progress{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--cyan),#9be6ff);width:0}

.dayhead{background:var(--grad);color:#fff;position:relative;overflow:hidden}
.dayhead svg.circuit{position:absolute;inset:0;width:100%;height:100%;opacity:.16}
.dayhead .wrap{position:relative;padding-top:22px;padding-bottom:26px;display:flex;gap:18px;align-items:center}
.dayhead .big{font-size:76px;font-weight:900;line-height:.8;letter-spacing:-.04em}
.dayhead .big small{display:block;white-space:nowrap;font-size:13px;letter-spacing:.14em;font-weight:800;margin-top:10px;opacity:.9}
.dayhead h1{margin:0;font-size:clamp(18px,4.2vw,26px);font-weight:800;line-height:1.2}
.dayhead .sub{margin-top:6px;font-size:13px;font-weight:600;opacity:.9}

.jump{position:sticky;top:56px;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.jump .row{display:flex;gap:8px;overflow-x:auto;padding:10px 18px;scrollbar-width:none;max-width:1080px;margin:0 auto;scroll-snap-type:x proximity}
.jump .row::-webkit-scrollbar{display:none}
.jump a{cursor:pointer;flex:none;scroll-snap-align:start;text-decoration:none;font-size:12px;font-weight:700;padding:8px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);white-space:nowrap;max-width:270px;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.jump a.lv2{background:var(--navy);border-color:var(--navy);color:#fff}
.jump a.on{outline:2px solid var(--cyan);outline-offset:1px}

.reader{max-width:820px;margin:18px auto 0;padding:0 12px}
.agenda{margin-bottom:14px}
.agenda summary{font-size:14px}
.paper{background:var(--paper);border-radius:18px;box-shadow:var(--shadow);padding:26px 26px 30px}
.paper.doc{padding-bottom:60px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;font-weight:600;color:var(--muted);padding:2px 4px 14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}

/* ---------- WORD FORMATTING (Arial) ---------- */
.doc{font-family:Arial,Helvetica,sans-serif;color:var(--ink);line-height:1.42;hyphens:manual;-webkit-hyphens:manual;overflow-wrap:break-word}
.doc .p{margin:0 0 .62em}
.doc .gap{height:.55em}
.doc .al-justify{text-align:justify}
.doc .al-center{text-align:center}
.doc .al-right{text-align:right}
.doc .al-left{text-align:left}
.doc .fs10_5{font-size:calc(10.5pt * var(--z))}
.doc .fs11{font-size:calc(11pt * var(--z))}
.doc .fs12{font-size:calc(12pt * var(--z))}
.doc .fs13{font-size:calc(13pt * var(--z))}
.doc .fs14{font-size:calc(14pt * var(--z))}
.doc .fs15{font-size:calc(15pt * var(--z))}
.doc .fs17{font-size:calc(17pt * var(--z))}
.doc .fs24{font-size:calc(24pt * var(--z))}
.doc .b{font-weight:700}
.doc .i{font-style:italic}
.doc .u{text-decoration:underline}
.doc .c-red{color:var(--red)}
.doc .c-gray{color:var(--gray)}
.doc .c-blue{color:var(--docblue)}
.doc .c-ink{color:var(--ink)}
.doc .hl-y{background:#ffff00;color:#111;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.doc .hl-y.c-red{color:#c00000}
.doc .hl-g{background:#00ff00;color:#111;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.doc .hl-gr{background:#d9d9d9;color:#3a3a3a;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.doc .hl-soft{background:#fff2cc;color:#111}
.doc .st-heading1,.doc .st-heading2,.doc .st-heading3{scroll-margin-top:118px}
.doc .st-heading2{margin-top:1.5em;padding-top:.9em;border-top:2px solid var(--line)}
.doc .st-heading2:first-child{margin-top:0;padding-top:0;border-top:0}
.doc .st-heading3{margin-top:1.3em;padding:.5em .7em;border-left:5px solid var(--cyan);background:color-mix(in srgb,var(--cyan) 9%,transparent);border-radius:0 10px 10px 0}
.doc .eixo{background:color-mix(in srgb,var(--blue) 8%,transparent);border-radius:12px;padding:.7em .9em}
.doc .note{border-radius:10px}
.doc .photo{margin:1em 0}
.doc .pshade{background:#fff2cc;border-radius:8px;padding:.3em .5em}
html.dark .doc .pshade{background:#3d3418}

.doc .apoio-call{margin:1em 0 1.1em;padding:.75em .9em .2em;border:2px dashed color-mix(in srgb,var(--cyan) 70%,transparent);border-radius:12px;background:color-mix(in srgb,var(--cyan) 5%,transparent)}
.doc .apoio-call + .apoio-call{margin-top:-.4em}
.doc .apoio-tag{font-family:var(--ui);font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--blue);margin-bottom:.5em;text-transform:uppercase}
html.dark .doc .apoio-tag{color:#7fd0f7}
.doc .apoio-call .p{margin-bottom:.6em}

/* ---------- program timeline ---------- */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
.tl li:last-child{border-bottom:0}
.tl .t{font-weight:800;font-size:13px;color:var(--blue);line-height:1.35}
html.dark .tl .t{color:#7fd0f7}
.tl .w{font-size:14px;font-weight:600;line-height:1.4}
.tl .k-painel .w{font-weight:800}
.tl .k-painel .w::before{content:"PAINEL";display:inline-block;font-size:10px;font-weight:900;letter-spacing:.1em;background:var(--grad);color:#fff;border-radius:6px;padding:2px 6px;margin-right:6px;vertical-align:2px}
.tl .k-pausa .w{color:var(--muted)}
.tl .det{margin-top:6px;font-size:13px;font-weight:500;line-height:1.45;color:var(--muted)}
.tl .det b{color:var(--ink);font-weight:700}
.pday{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px}
.pday h3{margin:0 0 6px;display:flex;gap:12px;align-items:center;font-size:16px;font-weight:800}
.pday h3 .dt{background:var(--grad);color:#fff;border-radius:12px;padding:6px 10px;font-size:15px;font-weight:900;white-space:nowrap}
.pday h3 small{display:block;font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:800;text-transform:uppercase}
.pday .go{display:inline-flex;margin-top:8px;font-size:13px;font-weight:800;color:var(--blue);text-decoration:none}

/* ---------- pager & floating ---------- */
.pager{max-width:820px;margin:18px auto 0;padding:0 12px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pager a{background:var(--card);box-shadow:var(--shadow);border-radius:16px;padding:14px 16px;text-decoration:none;font-weight:800;font-size:14px;display:flex;flex-direction:column;gap:2px}
.pager a small{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:800}
.pager a.next{text-align:right;align-items:flex-end}
.pager .ph{visibility:hidden}
.fab{position:fixed;right:16px;bottom:calc(16px + var(--safe-b));z-index:40;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.fab button{border:0;cursor:pointer;background:var(--navy);color:#fff;box-shadow:0 6px 18px rgba(10,20,60,.35);border-radius:999px;height:48px;min-width:48px;padding:0 16px;font-weight:800;font-size:13px;display:inline-flex;align-items:center;gap:8px}
.fab .up{padding:0;width:48px;justify-content:center;background:#fff;color:var(--navy)}
html.dark .fab .up{background:#22335c;color:#fff}

.sheet-bg{position:fixed;inset:0;background:rgba(5,12,35,.5);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:82vh;overflow:auto;background:var(--paper);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);transform:translateY(105%);transition:transform .25s ease;padding:8px 20px calc(24px + var(--safe-b));max-width:820px;margin:0 auto}
.sheet{visibility:hidden}.sheet.open{transform:none;visibility:visible}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:6px auto 12px}
.sheet h3{margin:0 0 12px;font-size:14px;letter-spacing:.12em;font-weight:900;color:var(--navy2);display:flex;justify-content:space-between;align-items:center}
html.dark .sheet h3{color:#8fd3f5}
.sheet .x{border:0;background:var(--bg);border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:18px}

footer{margin:40px 0 0;padding:26px 0 calc(90px + var(--safe-b));color:var(--muted);font-size:12px;font-weight:600;text-align:center}
footer .logos{display:flex;justify-content:center;gap:22px;align-items:center;margin-bottom:10px}
footer .logos img{height:28px;background:#fff;border-radius:8px;padding:5px 8px}
.dl{display:flex;flex-wrap:wrap;gap:10px}
.dl a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-size:13px;font-weight:700;background:var(--card);box-shadow:var(--shadow);border-radius:12px;padding:11px 14px}

@media (max-width:620px){
  .wrap{padding:0 14px}
  .brandbar img.conaf{height:36px}
  .brandbar img.sind{height:26px}
  .hero .wrap{padding-top:22px;padding-bottom:30px}
  .hero .hero-grid{grid-template-columns:1fr;gap:16px}
  .days{grid-template-columns:1fr;gap:10px}
  .day{flex-direction:row;min-height:0;border-radius:16px}
  .day .top{flex-direction:column;align-items:flex-start;justify-content:center;gap:6px;width:96px;flex:none;padding:14px 12px}
  .day .num{font-size:46px}
  .day .wd{text-align:left}
  .day.isToday .wd{margin-top:0}
  .badge-today{top:auto;bottom:8px;left:10px;right:auto;font-size:9px}
  .day .body{padding:12px 14px;gap:8px}
  .day .title{font-size:14px}
  .reader{padding:0 0;margin-top:12px}
  .paper{border-radius:0;padding:20px 16px 26px;box-shadow:none}
  .agenda{margin:0 12px 12px}
  .legend{padding:2px 14px 12px}
  .dayhead .big{font-size:60px}
  .tl li{grid-template-columns:78px 1fr;gap:10px}
  .pager{padding:0 12px}
  .doc .al-justify{text-align:left}
  .fab{right:12px;gap:8px}
  .fab button{height:46px;min-width:46px}
  .fab .apoio{width:46px;padding:0;justify-content:center}
  .fab .apoio span{display:none}
}
@media print{
  .appbar,.jump,.fab,.pager,.brandbar,footer,.agenda,.legend{display:none!important}
  .paper{box-shadow:none}
  body{background:#fff}
}
</style>
</head>

<script id="data" type="application/json">{"days": {"9": {"html": "<div class=\"p al-justify st-normal eixo\"><span class=\"fs12 b\">EIXO DO DIA:<\/span><span class=\"fs12\"> ABERTURA OFICIAL, GEOPOLÍTICA E FUTURO DA RECEITA FEDERAL DO BRASIL.<\/span><\/div>\n<div class=\"p al-justify st-heading2\" id=\"d9-2\"><span class=\"fs14 b u c-blue\">MANHÃ | 9H ÀS 12H30<\/span><\/div>\n<div class=\"p al-justify st-heading3\" id=\"d9-3\"><span class=\"fs14 b c-blue\">9H — SOLENIDADE DE ABERTURA OFICIAL<\/span><\/div>\n<div class=\"p al-right st-normal note\"><span class=\"fs11 i c-red\">[ANTES DE INICIAR: VERIFICAR PRESENÇA DAS AUTORIDADES E CONFIRMAR A ORDEM PROTOCOLAR COM A COMISSÃO ORGANIZADORA.]<\/span><\/div>\n<div class=\"gap\"><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">BOM DIA, SENHORAS E SENHORES! SEJAM TODOS MUITO BEM-VINDOS AO CONGRESSO NACIONAL DOS AUDITORES-FISCAIS DA RECEITA FEDERAL DO BRASIL — CONAF 2026.<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14\">NESTA EDIÇÃO, REUNIMO-NOS EM TORNO DO TEMA “DESAFIOS DOS AUDITORES-FISCAIS NA ERA DIGITAL: SOLUÇÕES PARA A JUSTIÇA TRIBUTÁRIA”. UM TEMA QUE NOS CONVIDA A REFLETIR SOBRE AS TRANSFORMAÇÕES TECNOLÓGICAS, INSTITUCIONAIS E SOCIAIS QUE IMPACTAM A ADMINISTRAÇÃO TRIBUTÁRIA E SOBRE O PAPEL ESTRATÉGICO DOS AUDITORES-FISCAIS NA CONSTRUÇÃO DE UM SISTEMA TRIBUTÁRIO MAIS JUSTO.<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14\">O CONAF 2026 TERÁ SETE DIAS DE PROGRAMAÇÃO INTEGRADA, COM CINCO PAINÉIS TEMÁTICOS QUE CONTAM COM PALESTRANTES E ESPECIALISTAS DE RENOME. A PROGRAMAÇÃO INCLUI, AINDA, SESSÕES INTENSIVAS DE DEBATE EM GRUPOS DE TRABALHO E EM PLENÁRIO, DEDICADAS AO CADERNO DE TESES E ÀS ALTERAÇÕES ESTATUTÁRIAS PREVIAMENTE APROVADAS EM ASSEMBLEIAS GERAIS.<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14\">NESTA MANHÃ DE ABERTURA, O NOSSO OLHAR SE VOLTA TAMBÉM PARA O CENÁRIO GEOPOLÍTICO E PARA OS RUMOS DO BRASIL, CONSIDERANDO OS DESAFIOS À SOBERANIA NACIONAL, A AGENDA DE DESENVOLVIMENTO ECONÔMICO E SOCIAL E A ATUAÇÃO DO ESTADO.<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">PARA COMPOR A MESA DE ABERTURA, CONVIDAMOS: <\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 c-red\">[PREENCHER — NOME E CARGO DO(A) PRESIDENTE DO SINDIFISCO NACIONAL]; <\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 c-red\">[PREENCHER — AUTORIDADE DA PRESIDÊNCIA DA REPÚBLICA/VICE-PRESIDÊNCIA];<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 c-red\">[PREENCHER — MINISTRO(A) PRESIDENTE DO SUPREMO TRIBUNAL FEDERAL];<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 c-red\">[PREENCHER — PRESIDENTE DO CONGRESSO NACIONAL];<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 c-red\">[PREENCHER — MINISTRO(A) DA FAZENDA]; E<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 c-red\">[PREENCHER — SECRETÁRIO(A) ESPECIAL DA RECEITA FEDERAL DO BRASIL].<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b hl-y\">MC: <\/span><span class=\"fs14 hl-y\">ENQUANTO TODOS SE ACOMODAM NA MESA, REGISTRO A PRESENÇA DE:<\/span><span class=\"fs14\"> <\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 c-red\">[PREENCHER — DEMAIS AUTORIDADES E REPRESENTANTES QUE INTEGRARÃO A MESA, CONFORME PROTOCOLO].<\/span><\/div>\n<div class=\"gap\"><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs11 i c-gray hl-gr\">[AGUARDAR ACOMODAÇÃO DA MESA. CONFIRMAR SE HAVERÁ EXECUÇÃO DO HINO NACIONAL, PRONUNCIAMENTOS E ORDEM DE FALA. INSERIR CHAMADAS ABAIXO CONFORME PROTOCOLO APROVADO.]<\/span><\/div>\n<div class=\"gap\"><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b hl-y\">MC: <\/span><span class=\"fs14 hl-y\">PARA DAR INÍCIO À SOLENIDADE, CONVIDAMOS A TODOS A SE COLOCAREM EM POSIÇÃO DE RESPEITO PARA OUVIRMOS A EXECUÇAO DO HINO NACIONAL PELA CANTORA<\/span><span class=\"fs14 b hl-y\"> VERÔNICA FERRIANI E O VIOLONCELISTA THIAGO FARIA.<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b c-red\">MC: <\/span><span class=\"fs14 c-red\">CONVIDAMOS [PREENCHER — NOME E CARGO] PARA FAZER USO DA PALAVRA.<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b c-red\">MC: <\/span><span class=\"fs14 c-red\">OUVIREMOS AGORA [PREENCHER — NOME E CARGO]<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">DANDO SEQUÊNCIA, ASSISTIREMOS AGORA A UM VÍDEO QUE O SENADOR <\/span><span class=\"fs14 c-red\">PAULO PAIM <\/span><span class=\"fs14\">ENVIOU PARA O EVENTO.<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">AGORA ASSISTIREMOS A UM VÍDEO QUE O SECRETÁRIO ESPECIAL DA RECEITA FEDERAL DO BRASIL (ROBINSON BARREIRINHAS) ENVIOU PARA O CONAF.<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">COM A PALAVRA O PRESIDENTE DO SINDIFISCO NACIONAL <\/span><span class=\"fs14 b\">DÃO REAL PEREIRA DOS SANTOS<\/span><\/div>\n<div class=\"gap\"><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">DECLARADO O INÍCIO DOS TRABALHOS AGRADECEMOS AO MEMBROS DA MESA QUE SE DESFAZ, CONVIDANDO-OS QUE RETORNEM AOS SEUS LUGARES NO PLATÉIA.<\/span><\/div>\n<div class=\"p al-center st-normal photo\"><span class=\"fs14 hl-g\">FOTO OFICIAL – POSSÍVEIS INFORMES<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b hl-g\">HOMENAGEM À DARCILA<\/span><span class=\"fs14 b\"> – VÍDEO <\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: UM MINUTO DE SILÊNCIO<\/span><\/div>\n<div class=\"gap\"><\/div>\n<div class=\"p al-justify st-heading3\" id=\"d9-29\"><span class=\"fs11 b c-blue\">10H00 ÀS 12H30 — PAINEL 1: GEOPOLÍTICA E OS RUMOS DO BRASIL<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">DANDO CONTINUIDADE À PROGRAMAÇÃO, INICIAREMOS O PAINEL 1, “GEOPOLÍTICA E OS RUMOS DO BRASIL”. O DEBATE PROPÕE ANALISAR OS IMPACTOS DO CENÁRIO INTERNACIONAL E DAS TENSÕES GLOBAIS SOBRE A SOBERANIA BRASILEIRA E O DESENVOLVIMENTO ECONÔMICO E SOCIAL NO PERÍODO PÓS-ELEIÇÕES.<\/span><\/div>\n<div class=\"gap\"><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs10_5 hl-y\">MC: PARA COORDENAR ESTE PAINEL, CONVIDAMOS [A DEFINIR — REPRESENTANTE DA CATEGORIA].<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs10_5\">MC: CONVIDAMOS JOSÉ KOBORI. Empresário, investidor, consultor, professor e escritor, é membro de conselhos de administração e foi professor de Finanças do MBA do IBMEC por dez anos. Atuou como executivo da Xerox do Brasil e reúne experiência em finanças empresariais, planejamento estratégico, tecnologia e processos de fusões e aquisições.<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs10_5\">MC: CONVIDAMOS MARCO ANTÔNIO ROCHA. É professor associado e livre-docente do Instituto de Economia da Universidade Estadual de Campinas (Unicamp) e diretor executivo do Transforma-Unicamp. Sua trajetória acadêmica e de pesquisa concentra-se em economia industrial, política industrial e desenvolvimento econômico, com especial atenção à América Latina.<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs10_5\">MC: PARTICIPA, DE FORMA VIRTUAL, A PROFESSORA MÔNICA DE BOLLE. Pesquisadora sênior do Peterson Institute for International Economics, é doutora em Economia pela London School of Economics e graduada pela PUC-Rio. Foi diretora de estudos latino-americanos e mercados emergentes da Johns Hopkins University e professora de Macroeconomia da PUC-Rio. Sua atuação reúne pesquisas em macroeconomia, política cambial e monetária, política fiscal, comércio e desigualdade. É autora e coautora de diversos livros sobre a economia global e os desafios da política econômica brasileira.<\/span><\/div>\n<div class=\"gap\"><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">PASSAMOS A PALAVRA À(AO) COORDENADOR(A) PARA CONDUZIR O PAINEL.<\/span><\/div>\n<div class=\"gap\"><\/div>\n<div class=\"p al-center st-normal photo\"><span class=\"fs14 hl-g\">FOTO OFICIAL – POSSÍVEIS INFORMES<\/span><\/div>\n<div class=\"gap\"><\/div>\n<div class=\"p al-right st-normal note\"><span class=\"fs11 i c-gray\">[AO TÉRMINO DO PAINEL: AGRADECER AO COORDENADOR E AOS PALESTRANTES; ORIENTAR O PÚBLICO PARA O ALMOÇO.]<\/span><\/div>\n<div class=\"gap\"><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC:<\/span><span class=\"fs14\"> AGRADECEMOS À(AO) COORDENADOR(A) E AOS CONVIDADOS PELAS CONTRIBUIÇÕES. FAREMOS AGORA O INTERVALO PARA O ALMOÇO QUE SERÁ SERVIDO NO TÉRREO NO MESMO LOCAL DO CAFÉ DA MANHÃ. RETORNAREMOS ÀS 14H PARA O PAINEL 2. DESEJAMOS A TODOS UM EXCELENTE ALMOÇO!<\/span><\/div>\n<div class=\"apoio-call\"><div class=\"apoio-tag\">CHAMADA DE APOIO · AVISO DE PONTUALIDADE · SAÍDA PARA O ALMOÇO<\/div><div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">PARA O BOM ANDAMENTO DA PROGRAMAÇÃO, SOLICITAMOS A COLABORAÇÃO DE TODOS COM OS HORÁRIOS DE RETORNO E COM AS ORIENTAÇÕES DA ORGANIZAÇÃO.<\/span><\/div><\/div>\n<div class=\"gap\"><\/div>\n<div class=\"p al-justify st-heading2\" id=\"d9-39\"><span class=\"fs14 b u c-blue\">TARDE | 14H ÀS 19H<\/span><\/div>\n<div class=\"p al-justify st-heading3\" id=\"d9-40\"><span class=\"fs11 b c-blue\">14H00 ÀS 16H00 — PAINEL 2: A RECEITA FEDERAL NA RECONSTRUÇÃO NACIONAL: PROGRESSIVIDADE, JUSTIÇA FISCAL E DESENVOLVIMENTO<\/span><\/div>\n<div class=\"apoio-call\"><div class=\"apoio-tag\">CHAMADA DE APOIO · RETORNO APÓS INTERVALO · 14H<\/div><div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">SENHORAS E SENHORES, SOLICITAMOS QUE RETORNEM AOS SEUS LUGARES. RETOMAREMOS EM INSTANTES A PROGRAMAÇÃO DO CONAF 2026.<\/span><\/div><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">BOA TARDE A TODAS E A TODOS! RETOMAMOS A PROGRAMAÇÃO DO CONAF 2026, CUJO TEMA CENTRAL — “DESAFIOS DOS AUDITORES-FISCAIS NA ERA DIGITAL: SOLUÇÕES PARA A JUSTIÇA TRIBUTÁRIA” — ORIENTA NOSSA REFLEXÃO SOBRE A MODERNIZAÇÃO DO FISCO E A GARANTIA DE DIREITOS.<\/span><\/div>\n<div class=\"gap\"><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs10_5\">MC: O PAINEL 2, “A RECEITA FEDERAL NA RECONSTRUÇÃO NACIONAL: PROGRESSIVIDADE, JUSTIÇA FISCAL E DESENVOLVIMENTO”, DEBATERÁ O PAPEL ESTRATÉGICO DA RECEITA FEDERAL EM UMA REFORMA TRIBUTÁRIA ORIENTADA PELA JUSTIÇA FISCAL E PELA PROGRESSIVIDADE, COM ÊNFASE NA TRIBUTAÇÃO DA RENDA, DO PATRIMÔNIO E DA RIQUEZA, NAS EXPERIÊNCIAS INTERNACIONAIS, NA REINDUSTRIALIZAÇÃO E NO FORTALECIMENTO DO ESTADO SOCIAL.<\/span><\/div>\n<div class=\"gap\"><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs10_5 hl-y\">MC: PARA COORDENAR ESTE PAINEL, CONVIDAMOS [A DEFINIR — REPRESENTANTE DA CATEGORIA].<\/span><\/div>\n<div class=\"gap\"><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs10_5\">MC: CONVIDAMOS O PROFESSOR MÁRCIO CALVET NEVES. Advogado empresarial e consultor especializado em matéria tributária e responsabilidade social corporativa, é membro do Conselho Deliberativo do Instituto Justiça Fiscal. É mestre e doutorando em Ciência Política pela Universidade Federal Fluminense, possui formação em políticas públicas pela University of Melbourne e LL.M. em Tributação pela Georgetown University, além de atuar como professor de pós-graduação na UERJ e na FGV.<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs10_5\">MC: CONVIDAMOS O PROFESSOR PEDRO HUMBERTO. Economista e pesquisador do Instituto de Pesquisa Econômica Aplicada (Ipea), é mestre em Economia pela Universidade do Estado do Rio de Janeiro e doutor em Política Tributária pela Universidade de Pretória. Desenvolve estudos sobre economia da tributação e justiça tributária, com destaque para os impostos sobre renda e propriedade, e é coautor de publicações sobre reforma e solidariedade fiscal.<\/span><\/div>\n<div class=\"gap\"><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs10_5\">MC: CONVIDAMOS A PROFESSORA RITA DE LA FERIA. É professora de Direito Tributário na Universidade de Leeds e professora visitante de Direito na Universidade de Oxford. Consultora de Reforma Tributária do Governo de Timor-Leste e integrante do painel consultivo do Office for Budget Responsibility, no Reino Unido, é referência internacional em direito e política tributária, tendo assessorado governos e recebido importantes reconhecimentos na área.<\/span><\/div>\n<div class=\"gap\"><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">PEDRO HUMBERTO — <\/span><span class=\"fs14\">……………………………………………………….<\/span><\/div>\n<div class=\"gap\"><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">PASSAMOS A PALAVRA À(AO) COORDENADOR(A) PARA CONDUZIR O PAINEL.<\/span><\/div>\n<div class=\"gap\"><\/div>\n<div class=\"p al-center st-normal photo\"><span class=\"fs14 hl-g\">FOTO OFICIAL – POSSÍVEIS INFORMES<\/span><\/div>\n<div class=\"gap\"><\/div>\n<div class=\"p al-right st-normal note\"><span class=\"fs11 i c-gray\">[16H — COFFEE BREAK. CONFIRMAR CHAMADA DE RETORNO E DURAÇÃO.]<\/span><\/div>\n<div class=\"gap\"><\/div>\n<div class=\"p al-justify st-heading3\" id=\"d9-51\"><span class=\"fs14 b c-blue\">16H00 — COFFEE BREAK<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">AGRADECEMOS À(AO) COORDENADOR(A) E AOS PAINELISTAS PELAS CONTRIBUIÇÕES E PELA PARTICIPAÇÃO NESTE DEBATE. FAREMOS AGORA UMA PAUSA PARA O COFFEE BREAK. RETORNAREMOS ÀS 16H30 PARA A SESSÃO PLENÁRIA INICIAL, COM A APROVAÇÃO DO REGIMENTO INTERNO DO CONAF 2026 E A ELEIÇÃO DA MESA DIRETORA DOS TRABALHOS.<\/span><\/div>\n<div class=\"apoio-call\"><div class=\"apoio-tag\">CHAMADA DE APOIO · AVISO DE PONTUALIDADE · SAÍDA PARA O COFFEE BREAK<\/div><div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">PARA O BOM ANDAMENTO DA PROGRAMAÇÃO, SOLICITAMOS A COLABORAÇÃO DE TODOS COM OS HORÁRIOS DE RETORNO E COM AS ORIENTAÇÕES DA ORGANIZAÇÃO.<\/span><\/div><\/div>\n<div class=\"gap\"><\/div>\n<div class=\"p al-justify st-heading3\" id=\"d9-53\"><span class=\"fs14 b c-blue\">16H30 — SESSÃO PLENÁRIA INICIAL<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">CONVIDAMOS TODAS E TODOS A RETOMAREM SEUS LUGARES PARA A SESSÃO PLENÁRIA INICIAL DO CONAF 2026, DESTINADA À APROVAÇÃO DO REGIMENTO INTERNO E À ELEIÇÃO DA MESA DIRETORA DOS TRABALHOS.<\/span><\/div>\n<div class=\"gap\"><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">PARA CONDUZIR ESTA ETAPA, SEGUINDO A DETERMINAÇÃO ESTATUTÁRIA, CONVIDAMOS O PRESIDENTE DO SINDIFISCO NACIONAL <\/span><span class=\"fs14 b\">DÃO REAL<\/span><span class=\"fs14\"> E PARA SECRETARIAR OS TRABALHOS <\/span><span class=\"fs14 c-red\">___________ <\/span><span class=\"fs14\">.<\/span><\/div>\n<div class=\"p al-right st-normal note\"><span class=\"fs11 i c-gray\">[A MC DEVERÁ SEGUIR AS ORIENTAÇÕES DA MESA DIRETORA E REALIZAR APENAS AS CHAMADAS QUE FOREM SOLICITADAS. PROGRAMAÇÃO CONSOLIDADA INDICA TÉRMINO PREVISTO ÀS 19H.]<\/span><\/div>\n<div class=\"gap\"><\/div>\n<div class=\"p al-justify st-heading1\"><span class=\"fs14 b c-ink\">MC:<\/span><span class=\"fs14 c-ink\"> SENHORAS E SENHORES, ESTAMOS CHEGANDO AO FINAL DAS ATIVIDADES DE HOJE DO CONAF 2026.<\/span><\/div>\n<div class=\"p al-justify st-heading1\"><span class=\"fs14 c-ink\">AGRADECEMOS A PARTICIPAÇÃO DE TODOS NESTE PRIMEIRO DIA DE DEBATES, REFLEXÕES E TROCA DE EXPERIÊNCIAS, QUE REFORÇAM A IMPORTÂNCIA DO DIÁLOGO E DA CONSTRUÇÃO COLETIVA DIANTE DOS DESAFIOS DOS AUDITORES-FISCAIS NA ERA DIGITAL E NA BUSCA POR SOLUÇÕES PARA A JUSTIÇA TRIBUTÁRIA.<\/span><\/div>\n<div class=\"p al-justify st-heading1\"><span class=\"fs14 c-ink\">CONVIDAMOS TODOS A APROVEITAREM OS MOMENTOS DE CONFRATERNIZAÇÃO E DESEJAMOS UMA EXCELENTE NOITE DE DESCANSO.<\/span><\/div>\n<div class=\"gap\"><\/div>\n<div class=\"p al-justify st-heading1\"><span class=\"fs14 c-ink\">AMANHÃ, ÀS 9 HORAS, RETOMAREMOS NOSSA PROGRAMAÇÃO, DANDO CONTINUIDADE AOS TRABALHOS DO CONGRESSO. CONTAMOS COM A PRESENÇA E A PONTUALIDADE DE TODOS.<\/span><\/div>\n<div class=\"p al-justify st-heading1\"><span class=\"fs14 c-ink\">MUITO OBRIGADA E ATÉ AMANHÃ!<\/span><\/div>", "nav": [{"id": "d9-2", "level": 2, "text": "MANHÃ | 9H ÀS 12H30"}, {"id": "d9-3", "level": 3, "text": "9H — SOLENIDADE DE ABERTURA OFICIAL"}, {"id": "d9-29", "level": 3, "text": "10H00 ÀS 12H30 — PAINEL 1: GEOPOLÍTICA E OS RUMOS DO BRASIL"}, {"id": "d9-39", "level": 2, "text": "TARDE | 14H ÀS 19H"}, {"id": "d9-40", "level": 3, "text": "14H00 ÀS 16H00 — PAINEL 2: A RECEITA FEDERAL NA RECONSTRUÇÃO NACIONAL: PROGRESSIVIDADE, JUSTIÇA FISCAL E DESENVOLVIMENTO"}, {"id": "d9-51", "level": 3, "text": "16H00 — COFFEE BREAK"}, {"id": "d9-53", "level": 3, "text": "16H30 — SESSÃO PLENÁRIA INICIAL"}], "title": "SEGUNDA-FEIRA, 9 DE NOVEMBRO DE 2026", "eixo": "ABERTURA OFICIAL, GEOPOLÍTICA E FUTURO DA RECEITA FEDERAL DO BRASIL", "pend": 11, "falas": 32}, "10": {"html": "<div class=\"p al-justify st-normal eixo\"><span class=\"fs12 b\">EIXO DO DIA:<\/span><span class=\"fs12\"> TRABALHOS EM GRUPOS, TESES TEMÁTICAS E ALTERAÇÕES ESTATUTÁRIAS.<\/span><\/div>\n<div class=\"p al-justify st-heading2\" id=\"d10-2\"><span class=\"fs14 b u c-blue\">MANHÃ | 9H ÀS 13H<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">BOM DIA, SENHORAS E SENHORES! SEJAM BEM-VINDOS A MAIS UM DIA DE TRABALHOS DO CONAF 2026. SOB O TEMA “DESAFIOS DOS AUDITORES-FISCAIS NA ERA DIGITAL: SOLUÇÕES PARA A JUSTIÇA TRIBUTÁRIA”, AVANÇAMOS HOJE DA REFLEXÃO SOBRE OS DESAFIOS CONTEMPORÂNEOS PARA A CONSTRUÇÃO COLETIVA DE PROPOSTAS QUE ORIENTARÃO A CATEGORIA.<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">A PROGRAMAÇÃO DESTA TERÇA-FEIRA É DEDICADA AOS DEBATES EM GRUPOS DE TRABALHO SOBRE TESES TEMÁTICAS E ALTERAÇÕES ESTATUTÁRIAS, A PARTIR DO CADERNO DE PROPOSTAS APROVADO NAS ASSEMBLEIAS LOCAIS.<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">CONVIDAMOS OS CONGRESSISTAS A SE DIRIGIREM AOS RESPECTIVOS GRUPOS DE TRABALHO E A OBSERVAREM AS ORIENTAÇÕES DE FUNCIONAMENTO E OS PRAZOS DEFINIDOS PELA ORGANIZAÇÃO.<\/span><\/div>\n<div class=\"p al-right st-normal note\"><span class=\"fs11 i c-red\">[PREENCHER — LOCAIS/SALAS DE CADA GRUPO DE TRABALHO, RESPONSÁVEIS E EVENTUAIS AVISOS LOGÍSTICOS.]<\/span><\/div>\n<div class=\"p al-justify st-heading2\" id=\"d10-7\"><span class=\"fs13 b c-blue\">TARDE | 14H30 ÀS 19H00<\/span><\/div>\n<div class=\"gap\"><\/div>\n<div class=\"apoio-call\"><div class=\"apoio-tag\">CHAMADA DE APOIO · RETORNO APÓS INTERVALO · 14H30<\/div><div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">SENHORAS E SENHORES, SOLICITAMOS QUE RETORNEM AOS SEUS LUGARES. RETOMAREMOS EM INSTANTES A PROGRAMAÇÃO DO CONAF 2026.<\/span><\/div><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">BOA TARDE! VAMOS RETOMAR OS TRABALHOS DOS GRUPOS DE TRABALHO DO CONAF 2026. NESTE PERÍODO, TERÃO CONTINUIDADE A ANÁLISE DE EMENDAS E DESTAQUES E A ELABORAÇÃO DOS PARECERES SETORIAIS.<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">LEMBRAMOS QUE, CONFORME A PROGRAMAÇÃO OFICIAL, O PRAZO LIMITE PARA A ENTREGA FORMAL DOS RELATÓRIOS CONCLUSIVOS DOS GRUPOS À MESA DIRETORA É HOJE, ATÉ AS 19H30. SOLICITAMOS ATENÇÃO AO CUMPRIMENTO DESSE HORÁRIO.<\/span><\/div>\n<div class=\"p al-right st-normal note\"><span class=\"fs11 i c-gray\">[16H — COFFEE BREAK; 16H30 — RETORNO AOS GRUPOS. A MESTRE DE CERIMÔNIAS DEVE DIVULGAR AVISOS ADICIONAIS SOMENTE APÓS VALIDAÇÃO DA ORGANIZAÇÃO.]<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">FAREMOS UMA PAUSA PARA O COFFEE BREAK. RETORNAREMOS ÀS 16H30 PARA O BLOCO FINAL DE DEBATES E A CONSOLIDAÇÃO DOS RELATÓRIOS. AGRADECEMOS A COLABORAÇÃO DE TODOS.<\/span><\/div>\n<div class=\"apoio-call\"><div class=\"apoio-tag\">CHAMADA DE APOIO · AVISO DE PONTUALIDADE · SAÍDA PARA O COFFEE BREAK<\/div><div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">PARA O BOM ANDAMENTO DA PROGRAMAÇÃO, SOLICITAMOS A COLABORAÇÃO DE TODOS COM OS HORÁRIOS DE RETORNO E COM AS ORIENTAÇÕES DA ORGANIZAÇÃO.<\/span><\/div><\/div><div class=\"apoio-call\"><div class=\"apoio-tag\">CHAMADA DE APOIO · RETORNO APÓS INTERVALO · 16H30 — RETORNO AOS GRUPOS<\/div><div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">SENHORAS E SENHORES, SOLICITAMOS QUE RETORNEM AOS SEUS LUGARES. RETOMAREMOS EM INSTANTES A PROGRAMAÇÃO DO CONAF 2026.<\/span><\/div><\/div>", "nav": [{"id": "d10-2", "level": 2, "text": "MANHÃ | 9H ÀS 13H"}, {"id": "d10-7", "level": 2, "text": "TARDE | 14H30 ÀS 19H00"}], "title": "TERÇA-FEIRA, 10 DE NOVEMBRO DE 2026", "eixo": "TRABALHOS EM GRUPOS, TESES TEMÁTICAS E ALTERAÇÕES ESTATUTÁRIAS", "pend": 1, "falas": 9}, "11": {"html": "<div class=\"p al-justify st-normal eixo\"><span class=\"fs12 b\">EIXO DO DIA:<\/span><span class=\"fs12\"> INTELIGÊNCIA ARTIFICIAL NO FISCO E INÍCIO DAS DELIBERAÇÕES EM PLENÁRIO.<\/span><\/div>\n<div class=\"gap\"><\/div>\n<div class=\"p al-justify st-heading2\" id=\"d11-2\"><span class=\"fs14 b u c-blue\">MANHÃ | 9H ÀS 13H<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">BOM DIA A TODAS E A TODOS! DAMOS INÍCIO A MAIS UMA JORNADA DO CONAF 2026. O TEMA “DESAFIOS DOS AUDITORES-FISCAIS NA ERA DIGITAL: SOLUÇÕES PARA A JUSTIÇA TRIBUTÁRIA” GANHA DESTAQUE NESTA MANHÃ AO DISCUTIRMOS INTELIGÊNCIA ARTIFICIAL, DADOS, ÉTICA DIGITAL E PROTEÇÃO DE INFORMAÇÕES.<\/span><\/div>\n<div class=\"p al-justify st-heading3\" id=\"d11-4\"><span class=\"fs11 b c-blue\">9H00 ÀS 11H00 — PAINEL 3: IA E A REVOLUÇÃO DOS DADOS NO FISCO<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">INICIAREMOS AGORA<\/span><span class=\"fs14 b\"> <\/span><span class=\"fs14\">O <\/span><span class=\"fs14 b\">PAINEL 3<\/span><span class=\"fs14\">, “<\/span><span class=\"fs14 b\">IA E A REVOLUÇÃO DOS DADOS NO FISCO<\/span><span class=\"fs14\">”, ABORDARÁ A APLICAÇÃO DE BLOCKCHAIN E INTELIGÊNCIA ARTIFICIAL NO COTIDIANO DA AUDITORIA-FISCAL, A PROTEÇÃO DE DADOS PESSOAIS E O ENFRENTAMENTO DE CRIMES COMPLEXOS, COMO A LAVAGEM DE DINHEIRO, SEM PERDER DE VISTA A ÉTICA DIGITAL E A AUTONOMIA DECISÓRIA HUMANA.<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs10_5\">MC: CONVIDAMOS O PROFESSOR MÁRCIO POCHMANN. Economista, professor e pesquisador, é doutor em Ciência Econômica e livre-docente pela Universidade Estadual de Campinas (Unicamp). Foi presidente do Ipea e, desde 2023, preside o Instituto Brasileiro de Geografia e Estatística (IBGE), com trajetória dedicada aos estudos sobre economia, trabalho e desenvolvimento.<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs10_5\">MC: CONVIDAMOS NINA DA HORA. Cientista da computação formada pela PUC-Rio e mestre em Ciência da Computação pela Unicamp, pesquisa auditoria de inteligência artificial, visão computacional, vieses algorítmicos e governança de dados. É fundadora e diretora do Instituto da Hora, dedicado aos direitos digitais e à justiça algorítmica, e integra iniciativas nacionais e internacionais voltadas à inteligência artificial responsável.<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs10_5\">MC: CONVIDAMOS O PROFESSOR SÉRGIO AMADEU DA SILVEIRA. Doutor em Ciência Política pela Universidade de São Paulo e professor titular da Universidade Federal do ABC, é pesquisador das implicações sociais, econômicas e políticas das tecnologias digitais. Sua trajetória inclui participação no Comitê Gestor da Internet no Brasil e estudos sobre inteligência artificial, sistemas algorítmicos, democracia e privacidade.<\/span><\/div>\n<div class=\"gap\"><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs10_5 hl-y\">MC: PARA COORDENAR O PAINEL, CONVIDAMOS [A DEFINIR — REPRESENTANTE DA CATEGORIA].<\/span><\/div>\n<div class=\"p al-justify st-heading3\" id=\"d11-10\"><span class=\"fs11 b c-blue\">11H00 ÀS 13H00 — SESSÃO PLENÁRIA DELIBERATIVA I<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">AGRADECEMOS AO COORDENADOR E AOS PAINELISTAS PELAS CONTRIBUIÇÕES E PELA PARTICIPAÇÃO NESTE DEBATE. DAREMOS SEQUÊNCIA À PROGRAMAÇÃO COM A <\/span><span class=\"fs14 b\">SESSÃO PLENÁRIA DELIBERATIVA I, <\/span><span class=\"fs14\">DESTINADA À APRESENTAÇÃO, AOS DEBATES E À VOTAÇÃO DOS RELATÓRIOS DOS GRUPOS DE TRABALHO SOBRE TESES E ALTERAÇÕES ESTATUTÁRIAS.<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b c-red\">MC: <\/span><span class=\"fs14 c-red\">CONVIDAMOS [PREENCHER — NOME E FUNÇÃO DE QUEM PRESIDIRÁ A SESSÃO] PARA CONDUZIR OS TRABALHOS.<\/span><\/div>\n<div class=\"gap\"><\/div>\n<div class=\"p al-justify st-heading2\" id=\"d11-13\"><span class=\"fs13 b c-blue\">13H00 ÀS 14H30 — ALMOÇO<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">ENCERRAMOS POR ORA AS ATIVIDADES DA MANHÃ. CONVIDAMOS TODOS OS CONGRESSISTAS PARA O INTERVALO DE ALMOÇO. RETORNAREMOS ÀS 14H30 PARA A CONTINUIDADE DAS DELIBERAÇÕES EM PLENÁRIO. DESEJAMOS A TODOS UM BOM ALMOÇO!<\/span><\/div>\n<div class=\"apoio-call\"><div class=\"apoio-tag\">CHAMADA DE APOIO · AVISO DE PONTUALIDADE · SAÍDA PARA O ALMOÇO<\/div><div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">PARA O BOM ANDAMENTO DA PROGRAMAÇÃO, SOLICITAMOS A COLABORAÇÃO DE TODOS COM OS HORÁRIOS DE RETORNO E COM AS ORIENTAÇÕES DA ORGANIZAÇÃO.<\/span><\/div><\/div>\n<div class=\"gap\"><\/div>\n<div class=\"p al-justify st-heading2\" id=\"d11-15\"><span class=\"fs14 b u c-blue\">TARDE | 14H30 ÀS 19H<\/span><\/div>\n<div class=\"apoio-call\"><div class=\"apoio-tag\">CHAMADA DE APOIO · RETORNO APÓS INTERVALO · 14H30<\/div><div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">SENHORAS E SENHORES, SOLICITAMOS QUE RETORNEM AOS SEUS LUGARES. RETOMAREMOS EM INSTANTES A PROGRAMAÇÃO DO CONAF 2026.<\/span><\/div><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">BOA TARDE! RETOMAMOS AS ATIVIDADES DELIBERATIVAS DO <\/span><span class=\"fs14 b\">CONAF 2026<\/span><span class=\"fs14\">. A PARTIR DE AGORA, TERÃO CONTINUIDADE AS DISCUSSÕES E DELIBERAÇÕES DAS PROPOSTAS TEMÁTICAS EM PLENÁRIO.<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">CONVIDAMOS OS CONGRESSISTAS A ACOMPANHAREM AS ORIENTAÇÕES DA MESA DIRETORA PARA A SESSÃO PLENÁRIA DELIBERATIVA II.<\/span><\/div>\n<div class=\"p al-right st-normal note\"><span class=\"fs11 i c-gray\">[16H — COFFEE BREAK; 16H30 — SESSÃO PLENÁRIA DELIBERATIVA III. CONFIRMAR CHAMADAS DE RETORNO COM A MESA DIRETORA.]<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">FAREMOS UMA PAUSA PARA O COFFEE BREAK E RETORNAREMOS ÀS 16H30 PARA O BLOCO VESPERTINO DE DEBATES E DELIBERAÇÕES EM PLENÁRIO. OBRIGADA E ATÉ JÁ.<\/span><\/div>\n<div class=\"apoio-call\"><div class=\"apoio-tag\">CHAMADA DE APOIO · AVISO DE PONTUALIDADE · SAÍDA PARA O COFFEE BREAK<\/div><div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">PARA O BOM ANDAMENTO DA PROGRAMAÇÃO, SOLICITAMOS A COLABORAÇÃO DE TODOS COM OS HORÁRIOS DE RETORNO E COM AS ORIENTAÇÕES DA ORGANIZAÇÃO.<\/span><\/div><\/div><div class=\"apoio-call\"><div class=\"apoio-tag\">CHAMADA DE APOIO · RETORNO APÓS INTERVALO · 16H30<\/div><div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">SENHORAS E SENHORES, SOLICITAMOS QUE RETORNEM AOS SEUS LUGARES. RETOMAREMOS EM INSTANTES A PROGRAMAÇÃO DO CONAF 2026.<\/span><\/div><\/div><div class=\"apoio-call\"><div class=\"apoio-tag\">CHAMADA DE APOIO · CHAMADA PARA PLENÁRIA · 16H30 — SESSÃO PLENÁRIA DELIBERATIVA III<\/div><div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">CONVIDAMOS OS CONGRESSISTAS A OCUPAREM SEUS LUGARES PARA O INÍCIO DA SESSÃO PLENÁRIA. OS TRABALHOS SERÃO CONDUZIDOS PELA MESA DIRETORA DO CONAF 2026.<\/span><\/div><\/div>", "nav": [{"id": "d11-2", "level": 2, "text": "MANHÃ | 9H ÀS 13H"}, {"id": "d11-4", "level": 3, "text": "9H00 ÀS 11H00 — PAINEL 3: IA E A REVOLUÇÃO DOS DADOS NO FISCO"}, {"id": "d11-10", "level": 3, "text": "11H00 ÀS 13H00 — SESSÃO PLENÁRIA DELIBERATIVA I"}, {"id": "d11-13", "level": 2, "text": "13H00 ÀS 14H30 — ALMOÇO"}, {"id": "d11-15", "level": 2, "text": "TARDE | 14H30 ÀS 19H"}], "title": "QUARTA-FEIRA, 11 DE NOVEMBRO DE 2026", "eixo": "INTELIGÊNCIA ARTIFICIAL NO FISCO E INÍCIO DAS DELIBERAÇÕES EM PLENÁRIO", "pend": 2, "falas": 17}, "12": {"html": "<div class=\"p al-justify st-normal eixo\"><span class=\"fs12 b\">EIXO DO DIA:<\/span><span class=\"fs12\"> COMUNICAÇÃO PÚBLICA, DESINFORMAÇÃO E PLENÁRIA DELIBERATIVA.<\/span><\/div>\n<div class=\"p al-justify st-heading2\" id=\"d12-2\"><span class=\"fs14 b u c-blue\">MANHÃ | 9H ÀS 13H<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">BOM DIA, SENHORAS E SENHORES! SEJAM BEM-VINDOS A MAIS UM DIA DO CONAF 2026. AO REFLETIRMOS SOBRE “DESAFIOS DOS AUDITORES-FISCAIS NA ERA DIGITAL: SOLUÇÕES PARA A JUSTIÇA TRIBUTÁRIA”, VOLTAMOS HOJE NOSSA ATENÇÃO À DISPUTA DE NARRATIVAS NO AMBIENTE DIGITAL, À DESINFORMAÇÃO E À IMPORTÂNCIA DE COMUNICAR COM TRANSPARÊNCIA O VALOR DO FISCO PARA A SOCIEDADE.<\/span><\/div>\n<div class=\"p al-justify st-heading3\" id=\"d12-4\"><span class=\"fs14 b c-blue\">9H — PAINEL 4: AUDITORES NA ARENA DIGITAL: A BATALHA DAS NARRATIVAS<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">O PAINEL 4, <\/span><span class=\"fs14 b\">“AUDITORES NA ARENA DIGITAL: A BATALHA DAS NARRATIVAS”<\/span><span class=\"fs14\">, DISCUTIRÁ ESTRATÉGIAS DE COMBATE ÀS FAKE NEWS E À DESINFORMAÇÃO, A VALORIZAÇÃO DA IMAGEM INSTITUCIONAL DO AUDITOR-FISCAL E A COMUNICAÇÃO TRANSPARENTE SOBRE A CONTRIBUIÇÃO DO FISCO PARA A JUSTIÇA SOCIAL E A CIDADANIA.<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs10_5\">MC: CONVIDAMOS ELIARA SANTANA FERREIRA. Jornalista, doutora e mestre em Estudos Linguísticos pela PUC Minas, com pós-doutorado na Unicamp sobre desinformação e desinfodemia, também é graduada em Ciências Sociais pela UFMG. Atua como professora de pós-graduação da Escola do Legislativo da ALMG e pesquisadora nas áreas de mídia, opinião pública, eleições e democracia, coordenando o programa Desinformação &amp; Política, na TV GGN.<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs10_5\">MC: CONVIDAMOS O PROFESSOR JOÃO CEZAR DE CASTRO ROCHA. Professor titular de Literatura Comparada da UERJ, pesquisador 1B do CNPq e Cientista do Nosso Estado pela FAPERJ, é doutor em Letras pela UERJ e em Literatura Comparada pela Stanford University. Foi presidente da Associação Brasileira de Literatura Comparada e é autor de numerosos livros, com trabalhos traduzidos para diversos idiomas.<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs10_5\">MC: CONVIDAMOS SAMARA MARIANA DE CASTRO. Secretária-executiva da Secretaria de Comunicação Social da Presidência da República, é mestre em Direito Público e Econômico e advogada especializada em direito eleitoral e digital. Já atuou na promoção da liberdade de expressão e integra instâncias governamentais ligadas à transformação digital e à proteção de dados; participou do grupo de Economia Digital do G20 e recebeu, em 2024, reconhecimento no Global Leadership Awards da Vital Voices.<\/span><\/div>\n<div class=\"gap\"><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: PARA COORDENAR ESTE PAINEL, CONVIDAMOS PAULO GIL, AUDITOR-FISCAL. PASSAMOS A PALAVRA AO COORDENADOR PARA CONDUZIR O DEBATE.<\/span><\/div>\n<div class=\"p al-justify st-heading3\" id=\"d12-10\"><span class=\"fs11 b c-blue\">11H00 ÀS 13H00 — SESSÃO PLENÁRIA DELIBERATIVA IV<\/span><\/div>\n<div class=\"gap\"><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">AGRADECEMOS AOS PAINELISTAS E AO COORDENADOR PELAS REFLEXÕES COMPARTILHADAS. DAREMOS CONTINUIDADE AOS TRABALHOS COM A SESSÃO PLENÁRIA DELIBERATIVA IV, DESTINADA À VOTAÇÃO DAS MATÉRIAS ESTATUTÁRIAS E DAS TESES REMANESCENTES.<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b c-red\">MC: <\/span><span class=\"fs14 c-red\">CONVIDAMOS [PREENCHER — NOME E FUNÇÃO DE QUEM PRESIDIRÁ A SESSÃO] PARA CONDUZIR OS TRABALHOS.<\/span><\/div>\n<div class=\"gap\"><\/div>\n<div class=\"p al-justify st-heading2\" id=\"d12-13\"><span class=\"fs14 b u c-blue\">ALMOÇO<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">CONVIDAMOS TODOS OS CONGRESSISTAS PARA O INTERVALO DE ALMOÇO. RETORNAREMOS ÀS 14H30 PARA A CONTINUIDADE DAS DELIBERAÇÕES EM PLENÁRIO. BOM ALMOÇO A TODAS E TODOS!<\/span><\/div>\n<div class=\"apoio-call\"><div class=\"apoio-tag\">CHAMADA DE APOIO · AVISO DE PONTUALIDADE · SAÍDA PARA O ALMOÇO<\/div><div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">PARA O BOM ANDAMENTO DA PROGRAMAÇÃO, SOLICITAMOS A COLABORAÇÃO DE TODOS COM OS HORÁRIOS DE RETORNO E COM AS ORIENTAÇÕES DA ORGANIZAÇÃO.<\/span><\/div><\/div>\n<div class=\"gap\"><\/div>\n<div class=\"p al-justify st-heading2\" id=\"d12-15\"><span class=\"fs14 b u c-blue\">TARDE | 14H30 ÀS 19H<\/span><\/div>\n<div class=\"gap\"><\/div>\n<div class=\"apoio-call\"><div class=\"apoio-tag\">CHAMADA DE APOIO · RETORNO APÓS INTERVALO · 14H30<\/div><div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">SENHORAS E SENHORES, SOLICITAMOS QUE RETORNEM AOS SEUS LUGARES. RETOMAREMOS EM INSTANTES A PROGRAMAÇÃO DO CONAF 2026.<\/span><\/div><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">BOA TARDE! RETOMAMOS A PROGRAMAÇÃO DELIBERATIVA DO CONAF 2026. NESTA TARDE, A PLENÁRIA DARÁ CONTINUIDADE À APRECIAÇÃO DE DESTAQUES E PROPOSTAS PRIORITÁRIAS E AOS ENCAMINHAMENTOS PARA A FASE FINAL DO CONGRESSO.<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">CONVIDAMOS TODAS E TODOS A ACOMPANHAREM A SESSÃO PLENÁRIA DELIBERATIVA V.<\/span><\/div>\n<div class=\"p al-right st-normal note\"><span class=\"fs12 i c-gray\">[16H — COFFEE BREAK; 16H30 — SESSÃO PLENÁRIA DELIBERATIVA VI. AJUSTAR A CHAMADA CONFORME A MESA DIRETORA.]<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">FAREMOS AGORA UMA PAUSA PARA O COFFEE BREAK. RETORNAREMOS ÀS 16H30 PARA O BLOCO DE VOTAÇÕES E ENCAMINHAMENTOS PARA A FASE FINAL DO CONGRESSO.<\/span><\/div>\n<div class=\"apoio-call\"><div class=\"apoio-tag\">CHAMADA DE APOIO · AVISO DE PONTUALIDADE · SAÍDA PARA O COFFEE BREAK<\/div><div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">PARA O BOM ANDAMENTO DA PROGRAMAÇÃO, SOLICITAMOS A COLABORAÇÃO DE TODOS COM OS HORÁRIOS DE RETORNO E COM AS ORIENTAÇÕES DA ORGANIZAÇÃO.<\/span><\/div><\/div><div class=\"apoio-call\"><div class=\"apoio-tag\">CHAMADA DE APOIO · RETORNO APÓS INTERVALO · 16H30<\/div><div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">SENHORAS E SENHORES, SOLICITAMOS QUE RETORNEM AOS SEUS LUGARES. RETOMAREMOS EM INSTANTES A PROGRAMAÇÃO DO CONAF 2026.<\/span><\/div><\/div><div class=\"apoio-call\"><div class=\"apoio-tag\">CHAMADA DE APOIO · CHAMADA PARA PLENÁRIA · 16H30 — SESSÃO PLENÁRIA DELIBERATIVA VI<\/div><div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">CONVIDAMOS OS CONGRESSISTAS A OCUPAREM SEUS LUGARES PARA O INÍCIO DA SESSÃO PLENÁRIA. OS TRABALHOS SERÃO CONDUZIDOS PELA MESA DIRETORA DO CONAF 2026.<\/span><\/div><\/div>", "nav": [{"id": "d12-2", "level": 2, "text": "MANHÃ | 9H ÀS 13H"}, {"id": "d12-4", "level": 3, "text": "9H — PAINEL 4: AUDITORES NA ARENA DIGITAL: A BATALHA DAS NARRATIVAS"}, {"id": "d12-10", "level": 3, "text": "11H00 ÀS 13H00 — SESSÃO PLENÁRIA DELIBERATIVA IV"}, {"id": "d12-13", "level": 2, "text": "ALMOÇO"}, {"id": "d12-15", "level": 2, "text": "TARDE | 14H30 ÀS 19H"}], "title": "QUINTA-FEIRA, 12 DE NOVEMBRO DE 2026", "eixo": "COMUNICAÇÃO PÚBLICA, DESINFORMAÇÃO E PLENÁRIA DELIBERATIVA", "pend": 1, "falas": 17}, "13": {"html": "<div class=\"p al-justify st-normal eixo\"><span class=\"fs12\">EIXO DO DIA: TRIBUTAÇÃO AMBIENTAL, ECONOMIA SUSTENTÁVEL E ENCERRAMENTO DO CONGRESSO.<\/span><\/div>\n<div class=\"p al-justify st-heading2\" id=\"d13-2\"><span class=\"fs14 b u c-blue\">MANHÃ | 9H ÀS 13H<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">BOM DIA, SENHORAS E SENHORES! CHEGAMOS AO ÚLTIMO DIA DE ATIVIDADES DO CONAF 2026. AO LONGO DESTA SEMANA, REFLETIMOS SOBRE OS DESAFIOS DOS AUDITORES-FISCAIS NA ERA DIGITAL E SOBRE SOLUÇÕES PARA A JUSTIÇA TRIBUTÁRIA. HOJE, AMPLIAMOS ESSE DEBATE PARA A TRIBUTAÇÃO AMBIENTAL, A JUSTIÇA CLIMÁTICA E O PAPEL DO FISCO NA TRANSIÇÃO ECOLÓGICA.<\/span><\/div>\n<div class=\"p al-justify st-heading3\" id=\"d13-4\"><span class=\"fs11 b c-blue\">8H30 ÀS 11H00 — PAINEL 5: TRIBUTAÇÃO AMBIENTAL E A ECONOMIA SUSTENTÁVEL<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">O PAINEL 5, <\/span><span class=\"fs14 b\">“TRIBUTAÇÃO AMBIENTAL E A ECONOMIA SUSTENTÁVEL”<\/span><span class=\"fs14\">, ABORDARÁ A TRIBUTAÇÃO VERDE E A JUSTIÇA CLIMÁTICA, INCLUINDO A TAXAÇÃO DE CARBONO, OS INCENTIVOS FISCAIS PARA PRÁTICAS SUSTENTÁVEIS E A ECONOMIA CIRCULAR.<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs10_5\">MC: CONVIDAMOS DENISE LUCENA CAVALCANTE. Professora titular de Direito Tributário e Financeiro da Universidade Federal do Ceará, é pós-doutora pela Universidade de Lisboa e doutora pela PUC de São Paulo. Preside o Instituto Latino-Americano de Tributação Ambiental (ILATA) e é procuradora aposentada da Fazenda Nacional.<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs10_5 c-red\">MC: CONVIDAMOS LEONARDO BOFF. [PREENCHER — MINIBIOGRAFIA; CURRÍCULO NÃO ENCAMINHADO].<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs10_5 c-red\">MC: CONVIDAMOS TATIANA FALCÃO. [PREENCHER — MINIBIOGRAFIA; CURRÍCULO NÃO ENCAMINHADO].<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs10_5 hl-y\">MC: PARA COORDENAR O PAINEL, CONVIDAMOS [A DEFINIR — REPRESENTANTE DA CATEGORIA]. PASSAMOS A PALAVRA À COORDENAÇÃO PARA CONDUZIR O DEBATE.<\/span><\/div>\n<div class=\"p al-justify st-heading3\" id=\"d13-10\"><span class=\"fs11 b c-blue\">11H00 ÀS 13H00 — SESSÃO PLENÁRIA DELIBERATIVA FINAL I<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">AGRADECEMOS AO COORDENADOR E AOS PAINELISTAS PELAS CONTRIBUIÇÕES. DAREMOS SEQUÊNCIA À SESSÃO PLENÁRIA DELIBERATIVA FINAL I, DEDICADA ÀS DELIBERAÇÕES FINAIS E À APRECIAÇÃO DO BLOCO CONCLUSIVO DE TESES.<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b c-red\">MC: <\/span><span class=\"fs14 c-red\">CONVIDAMOS [PREENCHER — NOME E FUNÇÃO DE QUEM PRESIDIRÁ A SESSÃO] PARA CONDUZIR OS TRABALHOS.<\/span><\/div>\n<div class=\"gap\"><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">CONVIDAMOS TODOS OS CONGRESSISTAS PARA O INTERVALO DE ALMOÇO. RETORNAREMOS ÀS 14H30 PARA A ETAPA FINAL DAS DELIBERAÇÕES DO CONAF 2026. DESEJAMOS A TODOS UM EXCELENTE ALMOÇO!<\/span><\/div>\n<div class=\"apoio-call\"><div class=\"apoio-tag\">CHAMADA DE APOIO · AVISO DE PONTUALIDADE · SAÍDA PARA O ALMOÇO<\/div><div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">PARA O BOM ANDAMENTO DA PROGRAMAÇÃO, SOLICITAMOS A COLABORAÇÃO DE TODOS COM OS HORÁRIOS DE RETORNO E COM AS ORIENTAÇÕES DA ORGANIZAÇÃO.<\/span><\/div><\/div>\n<div class=\"gap\"><\/div>\n<div class=\"p al-justify st-heading2\" id=\"d13-14\"><span class=\"fs14 b u c-blue\">TARDE | 14H30 ÀS 18H<\/span><\/div>\n<div class=\"apoio-call\"><div class=\"apoio-tag\">CHAMADA DE APOIO · RETORNO APÓS INTERVALO · 14H30<\/div><div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">SENHORAS E SENHORES, SOLICITAMOS QUE RETORNEM AOS SEUS LUGARES. RETOMAREMOS EM INSTANTES A PROGRAMAÇÃO DO CONAF 2026.<\/span><\/div><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">BOA TARDE! RETOMAMOS A PROGRAMAÇÃO DO ÚLTIMO DIA DO CONAF 2026. NESTA ETAPA FINAL, SERÃO CONSOLIDADAS AS RESOLUÇÕES APROVADAS DURANTE O CONGRESSO.<\/span><\/div>\n<div class=\"p al-justify st-heading3\" id=\"d13-16\"><span class=\"fs14 b c-blue\">14H30 — SESSÃO PLENÁRIA DELIBERATIVA FINAL II<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">CONVIDAMOS OS CONGRESSISTAS A ACOMPANHAREM A SESSÃO PLENÁRIA DELIBERATIVA FINAL II, DESTINADA À CONSOLIDAÇÃO DAS RESOLUÇÕES APROVADAS NO CONAF 2026.<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b c-red\">MC: <\/span><span class=\"fs14 c-red\">PARA CONDUZIR OS TRABALHOS, CONVIDAMOS [PREENCHER — NOME E FUNÇÃO DE QUEM PRESIDIRÁ A SESSÃO].<\/span><\/div>\n<div class=\"gap\"><\/div>\n<div class=\"p al-right st-normal note\"><span class=\"fs12 i c-gray\">[16H — COFFEE BREAK; RETORNO ÀS 16H30 PARA ENCERRAMENTO. CONFIRMAR SE HAVERÁ LEITURA INTEGRAL DA CARTA DE ATIBAIA OU APENAS ANÚNCIO DE SEUS PRINCIPAIS PONTOS.]<\/span><\/div>\n<div class=\"gap\"><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">FAREMOS UMA PAUSA PARA O COFFEE BREAK. RETORNAREMOS ÀS 16H30 PARA A SESSÃO DE ENCERRAMENTO DO CONAF 2026, COM A LEITURA DA CARTA DE ATIBAIA E O ANÚNCIO DAS RESOLUÇÕES OFICIAIS DO CONGRESSO.<\/span><\/div>\n<div class=\"apoio-call\"><div class=\"apoio-tag\">CHAMADA DE APOIO · AVISO DE PONTUALIDADE · SAÍDA PARA O COFFEE BREAK<\/div><div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">PARA O BOM ANDAMENTO DA PROGRAMAÇÃO, SOLICITAMOS A COLABORAÇÃO DE TODOS COM OS HORÁRIOS DE RETORNO E COM AS ORIENTAÇÕES DA ORGANIZAÇÃO.<\/span><\/div><\/div>\n<div class=\"p al-justify st-heading3\" id=\"d13-21\"><span class=\"fs14 b c-blue\">16H30 — SESSÃO DE ENCERRAMENTO<\/span><\/div>\n<div class=\"apoio-call\"><div class=\"apoio-tag\">CHAMADA DE APOIO · RETORNO APÓS INTERVALO · 16H30<\/div><div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">SENHORAS E SENHORES, SOLICITAMOS QUE RETORNEM AOS SEUS LUGARES. RETOMAREMOS EM INSTANTES A PROGRAMAÇÃO DO CONAF 2026.<\/span><\/div><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">SENHORAS E SENHORES, CHEGAMOS À SESSÃO DE ENCERRAMENTO DO CONGRESSO NACIONAL DOS AUDITORES-FISCAIS DA RECEITA FEDERAL DO BRASIL — CONAF 2026.<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14\">AO LONGO DESTES DIAS, COMPARTILHAMOS ANÁLISES, EXPERIÊNCIAS E PROPOSTAS SOBRE OS DESAFIOS DA ERA DIGITAL, A TRANSFORMAÇÃO DA ADMINISTRAÇÃO TRIBUTÁRIA, A COMUNICAÇÃO PÚBLICA, A PROTEÇÃO DE DADOS, A JUSTIÇA TRIBUTÁRIA E A SUSTENTABILIDADE. QUE AS DISCUSSÕES E DELIBERAÇÕES AQUI REALIZADAS CONTRIBUAM PARA FORTALECER A ATUAÇÃO DOS AUDITORES-FISCAIS E O COMPROMISSO COM UMA SOCIEDADE MAIS JUSTA.<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b c-red\">MC: <\/span><span class=\"fs14 c-red\">CONVIDAMOS [PREENCHER — NOME E CARGO] PARA PROCEDER À LEITURA DA CARTA DE ATIBAIA.<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b c-red\">MC: <\/span><span class=\"fs14 c-red\">NA SEQUÊNCIA, CONVIDAMOS [PREENCHER — NOME E CARGO] PARA ANUNCIAR AS RESOLUÇÕES OFICIAIS DO CONAF 2026.<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14 b\">MC: <\/span><span class=\"fs14\">AGRADECEMOS À COMISSÃO ORGANIZADORA, AOS PALESTRANTES, ÀS AUTORIDADES, AOS CONGRESSISTAS E A TODAS AS EQUIPES ENVOLVIDAS NA REALIZAÇÃO DESTE ENCONTRO.<\/span><\/div>\n<div class=\"p al-justify st-normal\"><span class=\"fs14\">EM NOME DO SINDIFISCO NACIONAL, DECLARAMOS ENCERRADOS OS TRABALHOS DO CONAF 2026. MUITO OBRIGADA E UM EXCELENTE RETORNO A TODAS E TODOS!<\/span><\/div>\n<div class=\"p al-right st-normal note\"><span class=\"fs14\">[<\/span><span class=\"fs12 c-red\">NOTA DE PRODUÇÃO: A PROGRAMAÇÃO CONSOLIDADA PREVÊ CHURRASCO DE CONFRATERNIZAÇÃO ÀS 19H. COMO O ENCERRAMENTO OFICIAL SOLICITADO PARA O ROTEIRO É ÀS 18H, CONFIRMAR COM A ORGANIZAÇÃO SE A MESTRE DE CERIMÔNIAS FARÁ A CHAMADA ANTES DE ENCERRAR.]<\/span><\/div>\n<div class=\"p al- }
function dayLabel(d){ const p = PROG[d]; return `${WD[p.weekday]||p.weekday.toUpperCase()} ${pad(d)}/11`; }

/* ---------- HOME ---------- */
function renderHome(){
  const td = todayDay();
  const cards = D.prog.map(p => {
    const s = D.days[p.day];
    const isT = td === p.day;
    const foot = s
      ? `<span class="chip">${I.mic} ${s.falas} falas</span>`
      : `<span class="chip mute">Sem falas da MC</span>`;
    return `<a class="day ${s?'':'soft'} ${isT?'isToday':''}" href="#dia-${p.day}">
      <div class="top">${isT?'<span class="badge-today">HOJE</span>':''}<div class="num">${pad(p.day)}</div><div class="wd">${(WD[p.weekday]||'')}<em>${p.n}º DIA</em></div></div>
      <div class="body"><div class="title">${esc(p.title)}</div><div class="foot">${foot}<span class="arrow">${I.arrow}</span></div></div>
    </a>`;
  }).join('');
  const todayBanner = td ? `<a class="today" href="#dia-${td}"><span><span class="kicker" style="color:var(--blue)">Hoje</span><br><b>${esc(PROG[td].title)}</b></span><span class="go">Abrir roteiro</span></a>` : '';
  app.innerHTML = `${brandbar()}
  <section class="hero">${CIRCUIT}<div class="wrap hero-grid">
    <div class="hero-main">
      <div class="kicker">Congresso Nacional dos Auditores-Fiscais da Receita Federal do Brasil</div>
      <h1>Roteiro da Mestre<br>de Cerimônias</h1>
      <div class="meta"><span>${I.cal} 8 a 14 de novembro de 2026</span><span>${I.pin} Bourbon Atibaia Resort — Atibaia/SP</span></div>
    </div>
    <div class="tema"><small>TEMA CENTRAL</small>${esc(D.tema)}</div>
  </div></section>
  <main class="wrap">
    ${todayBanner}
    <div class="sec"><h2>Escolha o dia</h2><span class="aside">Toque para abrir o roteiro</span></div>
    <div class="days">${cards}</div>

    <div class="sec"><h2>Consulta</h2></div>
    <div class="tools">
      <a class="tool" href="#programacao"><span class="ic">${I.list}</span><span><h3>Programação oficial</h3><p>Todos os horários, painéis e palestrantes dos 7 dias (versão de 07/11).</p></span></a>
    </div>

    <div class="sec"><h2>Orientações e pendências</h2></div>
    <details class="box"><summary><span>Orientação de uso do roteiro</span>${I.chev}</summary><div class="inner doc">${D.orient}</div></details>
    <details class="box"><summary><span style="display:flex;align-items:center;gap:10px">Pendências gerais para validação – Ana Rosa <span class="chip warn">${D.pend_open} em aberto</span></span>${I.chev}</summary><div class="inner doc">${D.pend}</div></details>

  </main>${footer()}`;
  document.title = 'CONAF 2026 · Roteiro da Mestre de Cerimônias';
  setFab(false);
}

/* ---------- AGENDA (program list) ---------- */
function timeline(p){
  return `<ul class="tl">${p.items.map(it => `<li class="k-${it.kind}"><div class="t">${esc(it.time)}</div><div><div class="w">${esc(it.title.replace(/^Painel \d+:\s*/,'') )}</div>${
    it.details.length ? `<div class="det">${it.details.map(([k,v]) => `<div><b>${esc(k)}:</b> ${esc(v)}</div>`).join('')}</div>` : ''
  }</div></li>`).join('')}</ul>`;
}

/* ---------- DAY ---------- */
function appbar(title, extra){
  return `<header class="appbar"><div class="wrap">
    <a class="back" href="#inicio">${I.back} Início</a>
    <div class="ttl">${title}</div>
    ${extra||''}
    <button class="iconbtn" data-zoom="-1" aria-label="Diminuir letra">A−</button>
    <button class="iconbtn" data-zoom="1" aria-label="Aumentar letra">A+</button>
    <button class="iconbtn" data-dark aria-label="Modo noturno">${dark?I.sun:I.moon}</button>
  </div><div class="progress" id="prog"></div></header>`;
}
function renderDay(d){
  const p = PROG[d]; const s = D.days[d];
  if (!p){ location.hash = '#inicio'; return; }
  const i = DAYS.indexOf(d);
  const prev = DAYS[i-1], next = DAYS[i+1];
  const pager = `<nav class="pager">${prev?`<a href="#dia-${prev}"><small>← DIA ANTERIOR</small>${dayLabel(prev)}</a>`:'<span class="ph"></span>'}${next?`<a class="next" href="#dia-${next}"><small>PRÓXIMO DIA →</small>${dayLabel(next)}</a>`:'<span class="ph"></span>'}</nav>`;
  const head = `<section class="dayhead">${CIRCUIT}<div class="wrap"><div class="big">${pad(d)}<small>${WD[p.weekday]}</small></div><div><div class="kicker">${p.n}º dia · ${esc(p.weekday)}</div><h1>${esc(p.title)}</h1>${s?`<div class="sub">${s.falas} falas da MC${s.pend?` · <span style="background:rgba(255,255,255,.18);padding:2px 8px;border-radius:999px">${s.pend} campos a preencher</span>`:''}</div>`:''}</div></div></section>`;
  let body;
  if (s){
    const jumps = s.nav.map(n => `<a class="lv${n.level}" href="#inicio"  data-jump="${n.id}">${esc(n.text)}</a>`).join('');
    body = `${jumps?`<div class="jump"><div class="row">${jumps}</div></div>`:''}
    <div class="reader">
      <details class="box agenda"><summary><span>Agenda oficial do dia</span>${I.chev}</summary><div class="inner">${timeline(p)}</div></details>
      <div class="legend"><span><i style="background:#c00000"></i>A preencher</span><span><i style="background:#ffff00;border:1px solid #d6d600"></i>Pendente / destaque</span><span><i style="background:#00ff00"></i>Foto oficial</span><span><i style="background:#8a8a8a"></i>Nota de produção</span><span><i style="background:transparent;border:2px dashed var(--cyan)"></i>Chamada de apoio</span></div>
      <article class="paper doc">${s.html}</article>
    </div>${pager}`;
  } else {
    body = `<div class="reader"><div class="paper" style="font-family:var(--ui)"><p style="margin:0 0 14px;font-weight:600;color:var(--muted);font-size:14px;line-height:1.5">Não há falas da Mestre de Cerimônias neste dia. Abaixo, a programação oficial.</p>${timeline(p)}</div></div>${pager}`;
  }
  app.innerHTML = appbar(dayLabel(d)) + head + body + footer();
  document.title = `${dayLabel(d)} · Roteiro MC · CONAF 2026`;
  setFab(!!s);
  bindJumps();
}

/* ---------- PROGRAM ---------- */
function renderProg(){
  const html = D.prog.map(p => `<div class="pday"><h3><span class="dt">${pad(p.day)}/11</span><span><small>${p.n}º dia · ${esc(p.weekday)}</small>${esc(p.title)}</span></h3>${timeline(p)}<a class="go" href="#dia-${p.day}">${D.days[p.day]?'Abrir roteiro do dia →':'Ver dia →'}</a></div>`).join('');
  app.innerHTML = appbar('Programação oficial') + `<section class="dayhead">${CIRCUIT}<div class="wrap"><div><div class="kicker">Atualizada em 07/11/2026</div><h1>Programação oficial</h1><div class="sub">${esc(D.tema)}</div></div></div></section><div class="reader">${html}</div>` + footer();
  document.title = 'Programação oficial · CONAF 2026';
  setFab(false);
}

/* ---------- floating + sheet ---------- */
let fab;
function setFab(show){
  if (!fab){
    fab = document.createElement('div'); fab.className = 'fab';
    fab.innerHTML = `<button class="up" aria-label="Voltar ao topo">${I.up}</button>`;
    document.body.appendChild(fab);
    fab.querySelector('.up').onclick = () => window.scrollTo({top:0,behavior:'smooth'});
  }
  fab.classList.toggle('hidden', !show);
}

document.addEventListener('click', e => {
  const nav = e.target.closest('a[href^="#"]:not([data-jump])');
  if (nav){
    const h = nav.getAttribute('href');
    if (/^#(inicio|programacao|dia-\d+)$/.test(h)){
      e.preventDefault();
      go(h);
      return;
    }
  }
  const z = e.target.closest('[data-zoom]');
  if (z){ zoom = Math.min(1.8, Math.max(0.7, Math.round((zoom + 0.1*Number(z.dataset.zoom))*10)/10)); store.set('zoom', zoom); applyPrefs(); return; }
  const dk = e.target.closest('[data-dark]');
  if (dk){ dark = !dark; store.set('dark', dark); applyPrefs(); dk.innerHTML = dark?I.sun:I.moon; return; }
  const j = e.target.closest('[data-jump]');
  if (j){ e.preventDefault(); const el = document.getElementById(j.dataset.jump); if (el) el.scrollIntoView({behavior:'smooth', block:'start'}); }
});

/* ---------- scroll progress + active chip ---------- */
let jumpEls = [];
function bindJumps(){
  jumpEls = [...document.querySelectorAll('[data-jump]')].map(a => [a, document.getElementById(a.dataset.jump)]).filter(x => x[1]);
}
window.addEventListener('scroll', () => {
  const pr = document.getElementById('prog');
  if (pr){ const h = document.documentElement.scrollHeight - innerHeight; pr.style.width = (h>0 ? Math.min(100, scrollY/h*100) : 0) + '%'; }
  if (jumpEls.length){
    let cur = null;
    for (const [a, el] of jumpEls){ if (el.getBoundingClientRect().top < 140) cur = a; }
    jumpEls.forEach(([a]) => a.classList.toggle('on', a === cur));
    if (cur && !cur.dataset.vis){ jumpEls.forEach(([a]) => delete a.dataset.vis); cur.dataset.vis = 1; cur.scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'}); }
  }
}, {passive:true});

/* ---------- router ---------- */
let current = '';
function go(h){
  current = h;
  renderRoute(h);
  try { if (location.hash !== h) history.pushState(null, '', h); } catch(err) {}
}
function route(){
  let h = '#inicio';
  try { h = location.hash || '#inicio'; } catch(err) {}
  if (h === current) return;
  current = h;
  renderRoute(h);
}
function renderRoute(h){
  let m;
  if ((m = h.match(/^#dia-(\d+)$/))) renderDay(Number(m[1]));
  else if (h === '#programacao') renderProg();
  else if (h === '#inicio' || h === '' || h === '#') renderHome();
  else return; // in-page anchors
  try { window.scrollTo(0,0); } catch(err) {}
}
window.addEventListener('hashchange', route);
window.addEventListener('popstate', route);
route();
})();
</script>
</body>
</html>
